<script>
  /* 变迁时间轴：按时间倒序渲染，标注「已发生 / 规划」
     ------------------------------------------------------------
     每个节点 = 年份（左轴外侧）+ 圆点 + 卡片（标题 / 状态标签 / 正文 / 来源）
     + 一张现场物证照片 + 可选的一句田野引语。
     配图与引语都按「era」字段对齐，不做顺序猜测：改 HISTORY 的顺序不会串图。
     所有图片均为课题组 2026 年 8 月在康鹭现场拍摄，图注写明拍摄内容与时间地点。 */
  var CHRONICLE_EXTRA = {
    '2024–至今': {
      now: true,
      img: {
        src: 'assets/img/boards/board-signage.jpg',
        alt: '海珠区纺织零工市场标识墙：白色墙面上是红字「海珠区纺织零工市场」与「新时代 新就业 新零工 新服务」标语',
        cap: '<b>海珠区纺织零工市场（标识墙）。</b>招工广场入口处的标识墙。广场由鹭江球场改建，2023 年 8 月启用；' +
             '到 2026 年，它已成为片区用工匹配的固定场所，日均人流量约 2 万人次。'
      },
      say: '一直在说，但只拆了那边一点点。'
    },
    '2023': {
      img: {
        src: 'assets/img/boards/board-data-timeline.jpg',
        alt: '零工市场服务数据板（左）与大事记时间轴展板（右）并排挂在墙上，大事记从2023年4月起逐月记录',
        cap: '<b>服务数据板与大事记时间轴。</b>挂在零工市场墙上的两块展板：左侧记录市场设置 6 大功能区、' +
             '搭建 3 个招工大棚、开通 10 台免费接驳便民巴士、累计往返运送超 334 万人次；' +
             '右侧的大事记从 2023 年 4 月起逐月记录。'
      },
      say: '也不知道什么时候拆到我们。'
    },
    '2020–2022': {
      img: {
        src: 'assets/img/boards/map-regulatory.jpg',
        alt: '原控规用地布局图：彩色地块标注新港西路、瑞康路、逸景路与广州大道南，图例标出「更新单元范围」与「改造范围」',
        cap: '<b>原控规用地布局图。</b>图上以红线标出「更新单元范围」与「改造范围」——' +
             '2020 年挂牌招商的凤和（康乐村、鹭江村）片区，就是这张图里的这块地。转载自公开渠道，仅作空间对照。'
      }
    },
    '2010s': {
      img: {
        src: 'assets/img/field/market-hiring-2.jpg',
        alt: '招工广场大棚下的招工与找活现场，人群密集',
        cap: '<b>今天的招工现场。</b>「小单快反」把用工推到极致，也就有了这种即招即用的场面：' +
             '老板举着样衣与工价牌，工人摸面料、估工价，几分钟完成一次匹配。<br>' +
             '环境影像，非本人肖像。课题组田野拍摄，2026 年 8 月。'
      }
    },
    '2000s': {
      img: {
        src: 'assets/img/field/arch-lujiang.jpg',
        alt: '鹭江村牌坊「鹭江春晓」，绿瓦飞檐，牌坊后是密集的自建楼与车流',
        cap: '<b>鹭江牌坊（「鹭江春晓」）。</b>片区东北入口。2000 年后，在政府整治改造推动下，' +
             '制衣厂陆续搬进这一带的村民自建房，鹭江、康乐逐渐成形。课题组田野拍摄，2026 年 8 月。'
      },
      say: '听说要拆，但还早。'
    },
    '1980s末–1990s': {
      img: {
        src: 'assets/img/field/arch-kangle-2.jpg',
        alt: '康乐东约牌坊夜景：朱红瓦顶的牌坊「康樂東約」夹在现代楼宇与车流之间',
        cap: '<b>康乐东约牌坊。</b>牌坊内外是两种城市：外侧是新港西路的高层与车流，' +
             '内侧就是康乐村的街巷。1980 年代末，中山大学南门对面的零散布匹摊位，' +
             '把第一批制衣厂引到了这道门里面。课题组田野拍摄，2026 年 8 月。'
      }
    }
  };

  (function () {
    var box = document.getElementById('chronicleList');
    if (!box || typeof HISTORY === 'undefined') return;

    /* 状态判定：标题与正文里出现「规划 / 拟 / 预计 / 计划 / 将」的，标为「规划 / 预期」 */
    function status(t) {
      return /规划|拟|预计|计划|将/.test(t) ? { label: '规划 / 预期', cls: '' } : { label: '已发生', cls: 'key' };
    }

    box.innerHTML = HISTORY.slice().reverse().map(function (x) {
      var ex   = CHRONICLE_EXTRA[x.era] || {};
      var body = (x.body || []).join('');
      var st   = status(x.title + body);

      var fig = '';
      if (ex.img) {
        fig = '<figure class="chronicle-fig">'
            + '<img src="' + ex.img.src + '" alt="' + ex.img.alt + '" loading="lazy" decoding="async">'
            + '<figcaption>' + ex.img.cap
            + '<span class="cf-src">课题组田野拍摄，2026 年 8 月</span></figcaption>'
            + '</figure>';
      }

      var say = ex.say
        ? '<blockquote class="chronicle-say">「' + ex.say + '」'
          + '<cite>—— 2026 年 8 月田野走访中，康鹭制衣从业者与居民谈旧改时的原话</cite></blockquote>'
        : '';

      return '<article class="chronicle-item reveal' + (ex.now ? ' now' : '') + '">'
        + '<time class="era">' + x.era + '</time>'
        + '<div class="card">'
        + '<span class="tag ' + (st.cls ? 'brick' : '') + '">' + st.label + '</span>'
        + '<h3>' + x.title + '</h3>'
        + (x.body || []).map(function (p) { return '<p>' + p + '</p>'; }).join('')
        + '<p class="svc">来源：课题组整理的公开报道与既有资料，详见「关于研究 · 参考文献」</p>'
        + say
        + fig
        + '</div>'
        + '</article>';
    }).join('');
  })();
</script>
<script>initReveal();</script>
</body>
