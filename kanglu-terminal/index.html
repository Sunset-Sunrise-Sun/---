<script>
  document.getElementById('recPeople').textContent = PEOPLE.length;
  document.getElementById('recPoi').textContent = POIS.length;
  renderStats('#stats');
  renderHistory('#hist');
  initPeopleCarousel();

  // 占比条：只画「有明确来源的占比」。
  // 早先那张把定性描述画成比例的条形图（含「日结工占主流 70%」等）因查不到来源已被删除，
  // 不再恢复；下面这一条的口径见本段文案与 statement.html。
  /* 占比条数据。规则：只放**有公开来源**的占比，并把范围写进 t（标签）。
     v 是条的基准值，range 是区间上限 —— 上限部分用斜纹半透明条表示"区间/不确定"，
     这样区间不会被读成一条确定的实线。来源统一写在下方的出处行里。 */
  const BARS = [
    { l:'湖北籍从业者', v:80, c:'var(--red)', t:'约 8 成' },
    { l:'日结工占用工比例', v:50, hi:70, c:'var(--indigo)', t:'50%–70%' },
    { l:'外来人口占比', v:95, c:'var(--green)', t:'95% 以上' }
  ];
  document.getElementById('bars').innerHTML = BARS.map(b => `
    <div class="bar-row reveal">
      <span class="bl">${b.l}</span>
      <span class="bar-track">
        <span class="bar-fill" style="background:${b.c}"
              data-w="${b.v}"${b.hi ? ` data-rng="${b.hi - b.v}"` : ''}></span>
      </span>
      <span class="bv">${b.t}</span>
    </div>`).join('');

  // 滚动显现 / 数字滚动 / 进度条统一由 main.js 的 DOMContentLoaded 初始化，
  // 此处只负责把数据渲染进 DOM，避免重复创建 IntersectionObserver。
</script>

<script>
  // 人物章：四块以图为主的入口（读 people-data.js，整块可点）
  (function () {
    var row = document.getElementById('peopleRow');
    if (!row || typeof PEOPLE === 'undefined') return;
    var VIEW = [{"id":"a1","img":"assets/img/field/market-hiring-2.jpg","cap":"招工广场的上午 · 环境影像，非本人肖像"},{"id":"a2","img":"assets/img/field/market-hiring-1.jpg","cap":"招工广场棚下 · 环境影像，非本人肖像"},{"id":"a3","img":"assets/img/field/board-hiring-led.jpg","cap":"招工广场的 LED 公示屏 · 环境影像，非本人肖像"},{"id":"a4","img":"assets/img/field/arch-kangle-1.jpg","cap":"康乐东约牌坊一带街巷 · 环境影像，非本人肖像"}];
    row.innerHTML = PEOPLE.map(function (p) {
      var v = VIEW.filter(function (x) { return x.id === p.id; })[0] || VIEW[0];
      return '<a class="plate" href="person.html?id=' + encodeURIComponent(p.id) + '" style="height:clamp(240px,32vh,340px)">'
        + '<img src="' + v.img + '" alt="' + v.cap + '" loading="lazy">'
        + '<span class="plate-cap">'
        + '<i>档案' + p.no + ' · ' + (p.cat || '') + '</i>'
        + '<b>' + p.label + '</b>'
        + '<span>「' + p.quote + '」</span>'
        + '</span></a>';
    }).join('');
  })();
</script>
